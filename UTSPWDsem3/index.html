<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Rental Mobil Pak Hambali</title>
    <link rel="stylesheet" href="style.css" />
    <script src="script.js" defer></script>
  </head>
  <body>
    <div class="container">
      <h2>RENTAL MOBIL PAK HAMBALI</h2>
      <img
        src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcSgQKDXUzV90rlovvcsCEzJDFLml9kcEfTrYA&s"
        alt="Logo Rental"
        class="logo"
      />

      <form action="process.php" method="POST">
        <label>Tanggal Rental:</label>
        <input type="date" name="rentDate" required /><br />

        <label>Nama Pemesan:</label>
        <input
          type="text"
          name="renterName"
          placeholder="Masukkan nama Anda"
          required
        /><br />

        <label>Jenis Kelamin:</label>
        <div class="radioGroup">
          <label
            ><input type="radio" name="jk" value="Pria" required /> Pria</label
          >
          <label
            ><input type="radio" name="jk" value="Wanita" required />
            Wanita</label
          >
        </div>
        <br />

        <label>Pilihan Mobil:</label>
        <select name="carID" required>
          <option value="">-- Pilih Mobil --</option>
          <option value="M001">Innova</option>
          <option value="M002">BYD</option>
          <option value="M003">Avanza</option>
          <option value="M004">Pajero</option>
          <option value="M005">Ionic</option></select
        ><br />

        <label>Durasi Sewa (hari):</label>
        <input type="number" name="durationService" min="1" required /><br />

        <div class="buttonGroup">
          <button type="submit">Sewa</button>
          <button type="reset" class="batal">Batal</button>
        </div>
      </form>
    </div>
  </body>
</html>
